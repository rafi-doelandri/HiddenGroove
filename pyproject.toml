[project]
name = "data-artists"
version = "0.1.0"
description = "Local Data Engineer project for learning music analytics"
readme = "README.md"
authors = [
    { name = "rafi-doelandri", email = "rafidoelandri28@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
data-artists = "data_artists:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
